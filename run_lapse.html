<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Let's Play • PS4 Lapse Exploit (11.00 - 12.02)</title>
  <link rel="icon" type="image/png" href="icon0.png">
  <link rel="stylesheet" href="includes/style.css">
</head>
<body>
  <div class="main-wrapper">
    <!-- Header Card -->
    <div class="header-card">
      <h1 class="brand-title">LET'S PLAY</h1>
      <p class="brand-subtitle" id="state">Executing Lapse Kernel Exploit (11.00 - 12.02)...</p>
      
      <div class="badges-row">
        <span class="badge badge-primary">🎮 PS4 FW 11.00 - 12.02</span>
        <span class="badge badge-success">⚡ Lapse Engine Active</span>
        <span class="badge badge-secondary">🛡️ 100% Offline Cache</span>
        <span class="badge badge-info">👑 GoldHEN Loading</span>
      </div>
    </div>

    <!-- Glowing Progress Bar -->
    <div class="progress-card">
      <div class="progress-header">
        <div class="progress-status-text">
          <span>⚡</span>
          <span id="lapseStatus">Initializing Lapse kernel exploit pipeline...</span>
        </div>
        <span class="progress-percentage" id="lapsePct">20%</span>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="lapseBar" style="width: 20%;"></div>
      </div>

      <button type="button" class="debug-drawer-toggle" onclick="toggleLapseLog()">
        Show / Hide Detailed Console
      </button>
      <div id="out" class="debug-console"></div>
    </div>

    <!-- Return to Host -->
    <div class="action-container" style="margin-top: 4px;">
      <a href="index.html" class="launch-btn" style="text-decoration:none; padding: 10px 28px; font-size: 16px;">
        <span>🏠 Return to Home Menu</span>
      </a>
    </div>

    <!-- Footer -->
    <footer>
      <div><strong>LET'S PLAY HOST</strong> • Developed by <strong>Ahmed Elattar</strong></div>
    </footer>
  </div>

  <script>
    function toggleLapseLog() {
      const out = document.getElementById("out");
      out.style.display = out.style.display === "block" ? "none" : "block";
    }

    // Observe stage changes to update progress bar smoothly
    const stateEl = document.getElementById("state");
    const lapseStatus = document.getElementById("lapseStatus");
    const lapsePct = document.getElementById("lapsePct");
    const lapseBar = document.getElementById("lapseBar");
    const outEl = document.getElementById("out");

    function setLapseProgress(p, text) {
      lapseBar.style.width = p + "%";
      lapsePct.textContent = p + "%";
      if (text) lapseStatus.textContent = text;
    }

    const observer = new MutationObserver(() => {
      const txt = outEl.innerText || "";
      if (txt.includes("KERNEL-PATCHED") || txt.includes("HEN") || txt.includes("GoldHEN")) {
        setLapseProgress(100, "Jailbreak complete! GoldHEN loaded successfully.");
      } else if (txt.includes("KPATCH-SITES") || txt.includes("KPATCH-MAP")) {
        setLapseProgress(85, "Applying kernel patches...");
      } else if (txt.includes("KERNEL-ARW") || txt.includes("KARW")) {
        setLapseProgress(65, "Kernel Read/Write achieved.");
      } else if (txt.includes("LEAK") || txt.includes("uaf")) {
        setLapseProgress(45, "Leaking kernel addresses & triggering double-free...");
      } else if (txt.includes("PRIMITIVE")) {
        setLapseProgress(30, "WebKit userland primitive established.");
      }
    });

    observer.observe(outEl, { childList: true, subtree: true, characterData: true });
  </script>
  <script type="module" src="./chain_lapse.js"></script>
</body>
</html>
